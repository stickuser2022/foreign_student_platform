services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp_local_dev_password
      POSTGRES_DB: foreign_student_platform
    ports:
      - "5432:5432"
    volumes:
      - fsp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d foreign_student_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fsp_pgdata:
